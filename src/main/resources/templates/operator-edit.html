<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>NetLog - Update Operator Details - [[${operator?.callsign}]]</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/operator-edit.css">
  <link rel="stylesheet" href="/css/action-dialog.css">
  <script src="/js/action-dialog.js" defer></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body class="operator-edit-page">
<style>

body {
    margin: 0px;

  }

.navbar {
  overflow: hidden;

  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;

  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  letter-spacing: -0.0025em;
  place-items: center;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;

}

/* Main content */
.main {
  margin-top: 60px;
  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  /* font-size: clamp(1rem, 2.5vw, 2rem); */
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  font-weight: 400;
  letter-spacing: -0.0025em;
  line-height: 1.4;
  min-height: 100vh;
  /* place-items: center; */
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

.grid-container {
  display: grid;
  grid-template-columns: 50%  50%;
  margin: 20px;
  gap: 20px;
}
.line {
  margin : 20px;
}

.table-container {
        max-height: 500px;
        overflow-y: auto;
    }
    table {
        border-collapse: collapse;
    }
tbody {
        max-height: 450px;
        overflow-y: auto;
    }
    td {
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    th{
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    .rowpadded {
        height:20px;
    }
    .column75 {
        float: left;
        width: 75%;
    }
    .column90 {
        float: left;
        width: 90%;
    }
    .column25 {
        float: left;
        width: 25%;
    }
    .column10 {
        float: left;
        width: 10%;
    }

  .block {
    border: 1px;

    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

</style>

<script>
</script>

<div>
  <div class="navbar">
    <a href="/">Welcome</a>
    <a href="/activeEvents">Active Events</a>
    <a href="/recurringEvents">Recurring Events</a>
    <a href="/archives">Archives</a>
    <a href="/sections">Sections</a>
    <a href="/operators"><b>Operators</b></a>
    <a href="/locations">Locations</a>
    <button th:replace="~{fragments/theme :: toggle}"></button>
  </div>
  <div class="main">
    <header class="operator-edit-heading">
      <h1>Update Operator Details - [[${operator.callsign}]]</h1>
      <p>Update the properties of an operator, including their affiliations.</p>
    </header>
    <form th:action="|/operator-edit-action/${operator.id}|" method="post" class="operator-edit-form">
      <fieldset class="operator-edit-card">
        <legend>Operator details</legend>
        <div class="operator-edit-fields">
          <div>
            <label for="callsign">Callsign:</label>
            <input type="text" name="callsign" th:value="${operator.callsign}" id="callsign"
                   min="1" maxlength="9" class="form-control" required="required"/>
          </div>
          <div>
            <label for="name">Name:</label>
            <input type="text" name="name" th:value="${operator.name}" id="name"
                   min="1" maxlength="30" class="form-control"/>
          </div>
        </div>
      </fieldset>
      <section class="operator-edit-card operator-edit-location-card" aria-label="Operator location">
        <dl class="operator-edit-location">
          <div>
            <dt>Municipality</dt>
            <dd th:text="${operator.location?.name} ?: 'Not specified'"></dd>
          </div>
          <div>
            <dt>County</dt>
            <dd th:text="${operator.location?.county?.name} ?: 'Not specified'"></dd>
          </div>
          <div>
            <dt>State</dt>
            <dd th:text="${operator.location?.state?.name} ?: 'Not specified'"></dd>
          </div>
          <div>
            <dt>Country</dt>
            <dd th:text="${operator.location?.country?.name} ?: 'Not specified'"></dd>
          </div>
        </dl>
        <a class="block operator-edit-location-button" th:href="|/operator-edit-changelocation/${operator.id}|"
           data-action-dialog="steps" data-dialog-title="Change operator location"
           th:data-dialog-subject="${operator.callsign}">Change Location</a>
      </section>
      <fieldset class="operator-edit-card">
        <legend>Affiliations</legend>
        <div class="operator-edit-affiliations">
          <label for="isNTS">
            <input type="checkbox" id="isNTS" name="isNTS" th:value="${operator.isNTS()}" th:checked="${operator.isNTS()}">
            NTS affiliated
          </label>
          <label for="isSkywarn">
            <input type="checkbox" id="isSkywarn" name="isSkywarn" th:value="${operator.isSkywarn()}" th:checked="${operator.isSkywarn()}">
            SKYWARN affiliated
          </label>
          <label for="isRACES">
            <input type="checkbox" id="isRACES" name="isRACES" th:value="${operator.isRACES()}" th:checked="${operator.isRACES()}">
            RACES affiliated
          </label>
        </div>
      </fieldset>
      <section class="operator-edit-card operator-edit-actions" aria-label="Operator edit actions">
        <input type="submit" value="Update" class="btn btn-primary block"/>
        <a class="block" th:href="|/operator/${operator.id}|">Cancel</a>
      </section>
    </form>
  </div>
</div>

  <dialog th:replace="~{fragments/action-dialog :: dialog}"></dialog>
</body>
</html>
