<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>NetLog - Sections</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/action-dialog.css">
  <script src="/js/action-dialog.js" defer></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<style>

body {
    margin: 0px;

  }

.navbar {
  overflow: hidden;

  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;

  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  letter-spacing: -0.0025em;
  place-items: center;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;

}

/* Main content */
.main {
  margin-top: 60px;
  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  /* font-size: clamp(1rem, 2.5vw, 2rem); */
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  font-weight: 400;
  letter-spacing: -0.0025em;
  line-height: 1.4;
  min-height: 100vh;
  /* place-items: center; */
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

.grid-container {
  display: grid;
  grid-template-columns: 50%  50%;
  margin: 20px;
  gap: 20px;
}
.line {
  margin : 20px;
}

.table-container {
        max-height: 500px;
        overflow-y: auto;
    }
    table {
        border-collapse: collapse;
    }
tbody {
        max-height: 450px;
        overflow-y: auto;
    }
    td {
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    th{
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    .rowpadded {
        height:20px;
    }
    .column75 {
        float: left;
        width: 75%;
    }
    .column90 {
        float: left;
        width: 90%;
    }
    .column25 {
        float: left;
        width: 25%;
    }
    .column10 {
        float: left;
        width: 10%;
    }

</style>

<script>
</script>

<div>
  <div class="navbar">
    <a href="/">Welcome</a>
    <a href="/activeEvents">Active Events</a>
    <a href="/recurringEvents">Recurring Events</a>
    <a href="/archives">Archives</a>
    <a href="/sections"><b>Sections</b></a>
    <a href="/operators">Operators</a>
    <a href="/locations">Locations</a>
    <button th:replace="~{fragments/theme :: toggle}"></button>
  </div>
  <div class="main">
    <div><hr/></div>
    <div style="margin:20px;">
    <h1>Sections</h1>
    <p>Define and manage the ARRL sections in which members can participate in events such as nets and training.   <a href="/section-add" data-action-dialog="add" data-dialog-title="Add section"><b>Add</b></a>
    <div class="line" style="margin:0px"><hr/></div>
    </div>
    <div class="table-container" style="margin:20px;">
      <table id="group-list">
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <th:block th:each="item0 : ${sections}">
            <tr th:id="|${item0?.id}|">
              <td>[[${item0?.name}]]</td>
              <td>[[${item0?.description}]]</td>
              <td><a th:href="|/section/${item0?.id}|">Details</a>&nbsp;<a th:href="|/section-delete/${item0?.id}|"
                     data-action-dialog="delete" data-dialog-title="Delete section"
                     th:data-dialog-subject="${item0.name}">Delete</a></td>
            </tr>
          </th:block>
        </tbody>
      </table>
    </div>

  </div>
  </div>
</div>

  <dialog th:replace="~{fragments/action-dialog :: dialog}"></dialog>
</body>
</html>
