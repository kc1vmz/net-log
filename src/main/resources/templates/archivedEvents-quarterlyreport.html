<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>NetLog - Generate Quarterly Summary Report</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<style>

body {
    margin: 0px;

  }

.navbar {
  overflow: hidden;

  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;

  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  letter-spacing: -0.0025em;
  place-items: center;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;

}

/* Main content */
.main {
  margin-top: 60px;
  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  /* font-size: clamp(1rem, 2.5vw, 2rem); */
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  font-weight: 400;
  letter-spacing: -0.0025em;
  line-height: 1.4;
  min-height: 100vh;
  /* place-items: center; */
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

.grid-container {
  display: grid;
  grid-template-columns: 50%  50%;
  margin: 20px;
  gap: 20px;
}
.line {
  margin : 20px;
}

.table-container {
        max-height: 500px;
        overflow-y: auto;
    }
    table {
        border-collapse: collapse;
    }
tbody {
        max-height: 450px;
        overflow-y: auto;
    }
    td {
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    th{
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    .rowpadded {
        height:20px;
    }
    .column75 {
        float: left;
        width: 75%;
    }
    .column90 {
        float: left;
        width: 90%;
    }
    .column25 {
        float: left;
        width: 25%;
    }
    .column10 {
        float: left;
        width: 10%;
    }

  .block {
    border: 1px;

    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

</style>

<script>
</script>

<div>
  <div class="navbar">
    <a href="/">Welcome</a>
    <a href="/activeEvents">Active Events</a>
    <a href="/recurringEvents">Recurring Events</a>
    <a href="/archives"><b>Archives</b></a>
    <a href="/sections">Sections</a>
    <a href="/operators">Operators</a>
    <a href="/locations">Locations</a>
    <button th:replace="~{fragments/theme :: toggle}"></button>
  </div>
  <div class="main">
    <div class="line"><hr/></div>
    <div style="margin:20px;">
      <h1>Confirm generating quarterly summary report</h1>
    </div>
    <div class="line"><hr/></div>

    <div style="margin:20px;">
      <form action="/archivedEvents-quarterlyreport-action" method="post">
        <div>
          <p>Select the section, quarter and year of the report to generate.</p>
        </div>
        <div>
            <label for="sectionId" class="form-label">Section:</label>
            <select name="sectionId" id="sectionId">
            <th:block th:each="item0 : ${sections}">
              <option th:value="|${item0?.id}|">[[${item0?.name}]]</option>
            </th:block>
            </select>
        </div>
        <div class="mb-3">
            <label for="quarter" class="form-label">Quarter:</label>
            <select name="quarter" id="quarter"  class="form-control">
              <option value="Q1">Q1 (January - March)</option>
              <option value="Q2">Q2 (April - June)</option>
              <option value="Q3">Q3 (July - September)</option>
              <option value="Q4">Q4 (October - December)</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="year" class="form-label">Year:</label>
            <select name="year" id="year"  class="form-control">
              <option value="2026">2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
              <option value="2029">2029</option>
              <option value="2030">2030</option>
              <option value="2031">2031</option>
              <option value="2032">2032</option>
            </select>
        </div>
        <div class="line" style="margin:0px"><hr/></div>
        <div>
          <input type="submit" value="Generate Quarterly Summary Report" class="btn btn-primary block"/>
          <a class="block" href="/archives">Close</a>
        </div>
      </form>
    </div>

  </div>
  </div>
</div>

</body>
</html>
