<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>NetLog - Update Active Event - [[${event?.name}]]</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<style>

body {
    margin: 0px;

  }

.navbar {
  overflow: hidden;

  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;

  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  letter-spacing: -0.0025em;
  place-items: center;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;

}

/* Main content */
.main {
  margin-top: 60px;
  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  /* font-size: clamp(1rem, 2.5vw, 2rem); */
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  font-weight: 400;
  letter-spacing: -0.0025em;
  line-height: 1.4;
  min-height: 100vh;
  /* place-items: center; */
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

.grid-container {
  display: grid;
  grid-template-columns: 50%  50%;
  margin: 20px;
  gap: 20px;
}
.line {
  margin : 20px;
}

.grid-membership-container {
      display: grid;
      grid-template-columns: 30% 30% 40%;
      margin: 0px;
      gap: 20px;
    }
.table-container {
        max-height: 500px;
        overflow-y: auto;
    }
    table {
        border-collapse: collapse;
    }
tbody {
        max-height: 450px;
        overflow-y: auto;
    }
    td {
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    th{
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    .rowpadded {
        height:20px;
    }
    .column75 {
        float: left;
        width: 75%;
    }
    .column90 {
        float: left;
        width: 90%;
    }
    .column25 {
        float: left;
        width: 25%;
    }
    .column10 {
        float: left;
        width: 10%;
    }

  .block {
    border: 1px;

    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

</style>

<script>
</script>

<div>
  <div class="navbar">
    <a href="/">Welcome</a>
    <a href="/activeEvents"><b>Active Events</b></a>
    <a href="/recurringEvents">Recurring Events</a>
    <a href="/archives">Archives</a>
    <a href="/sections">Sections</a>
    <a href="/operators">Operators</a>
    <a href="/locations">Locations</a>
    <button th:replace="~{fragments/theme :: toggle}"></button>
  </div>
  <div class="main">
    <div><hr/></div>
    <div style="margin:20px;">
    <h1>Update Active Event Details - [[${event?.name}]]</h1>
    <p>Update an active event, including its Net Control operator and start time.
    <div class="line" style="margin:0px"><hr/></div>
    </div>

    <div style="margin:20px;">
      <form th:action="|/activeEvent-edit-action/${event?.id}|" method="post">
        <div class="mb-3">
            <label for="sectionId" class="form-label">Section:</label>
            [[${event?.section?.name}]]
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" name="name" id="name" min="1" class="form-control" th:value="|${event?.name}|" required="required"/>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <input type="text" name="description" id="description" th:value="|${event?.description}|" class="form-control"/>
        </div>
        <div>
            <label for="type" class="form-label">Type:</label>
            <select name="type" id="type" th:value="|${event?.type}|">
              <th:block th:if="${activeEventType1}">
              <option value="1" selected>Net</option>
              </th:block><th:block th:unless="${activeEventType1}">
              <option value="1">Net</option>
              </th:block>
              <th:block th:if="${activeEventType2}">
              <option value="2" selected>Training</option>
              </th:block><th:block th:unless="${activeEventType2}">
              <option value="2">Training</option>
              </th:block>
              <th:block th:if="${activeEventType3}">
              <option value="3" selected>Community Event</option>
              </th:block><th:block th:unless="${activeEventType3}">
              <option value="3">Community Event</option>
              </th:block>
              <th:block th:if="${activeEventType4}">
              <option value="4" selected>Exercise</option>
              </th:block><th:block th:unless="${activeEventType4}">
              <option value="4">Exercise</option>
              </th:block>
              <th:block th:if="${activeEventType5}">
              <option value="5" selected>Public Service Event</option>
              </th:block><th:block th:unless="${activeEventType5}">
              <option value="5">Public Service Event</option>
              </th:block>
              <th:block th:if="${activeEventType6}">
              <option value="6" selected>Emergency</option>
              </th:block><th:block th:unless="${activeEventType6}">
              <option value="6">Emergency</option>
              </th:block>
              <th:block th:if="${activeEventType7}">
              <option value="7" selected>SKYWARN</option>
              </th:block><th:block th:unless="${activeEventType7}">
              <option value="7">SKYWARN</option>
              </th:block>
              <th:block th:if="${activeEventType8}">
              <option value="8" selected>Meeting</option>
              </th:block><th:block th:unless="${activeEventType8}">
              <option value="8">Meeting</option>
              </th:block>
              <th:block th:if="${activeEventType9}">
              <option value="9" selected>Unclassified</option>
              </th:block><th:block th:unless="${activeEventType9}">
              <option value="9">Unclassified</option>
              </th:block>
            </select>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location:</label>
            <input type="text" name="location" id="location" th:value="|${event?.location}|" class="form-control"/>
        </div>
        <div>
            <label for="netControlCallsign" class="form-label">Net Control callsign:</label>
            <input type="text" name="netControlCallsign" id="netControlCallsign" th:value="|${event?.netControlCallsign}|" class="form-control"/>
        </div>
        <div class="mb-3">
            <label for="startTimeStr" class="form-label">Start time:</label>
            <input type="datetime-local" name="startTimeStr" id="startTimeStr" th:value="|${event?.startTime}|" class="form-control"/>
        </div>
        <div class="line" style="margin:0px"><hr/></div>
        <div>
          <input type="submit" value="Update" class="btn btn-primary block"/>
          <a class="block" th:href="|/activeEvent/${event?.id}|">Cancel</a>
        </div>
      </form>
    </div>
  </div>
  </div>
</div>

</body>
</html>
