<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>NetLog - Update Participant - [[${participant?.operator?.callsign}]]</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<style>

body {
    margin: 0px;

  }

.navbar {
  overflow: hidden;

  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;

  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  letter-spacing: -0.0025em;
  place-items: center;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;

}

/* Main content */
.main {
  margin-top: 60px;
  font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
  /* font-size: clamp(1rem, 2.5vw, 2rem); */
  -webkit-font-smoothing: antialiased;
  font-style: normal;
  font-weight: 400;
  letter-spacing: -0.0025em;
  line-height: 1.4;
  min-height: 100vh;
  /* place-items: center; */
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}

.grid-container {
  display: grid;
  grid-template-columns: 50%  50%;
  margin: 20px;
  gap: 20px;
}
.line {
  margin : 20px;
}

.grid-membership-container {
      display: grid;
      grid-template-columns: 30% 30% 40%;
      margin: 0px;
      gap: 20px;
    }
.table-container {
        max-height: 500px;
        overflow-y: auto;
    }
    table {
        border-collapse: collapse;
    }
tbody {
        max-height: 450px;
        overflow-y: auto;
    }
    td {
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    th{
        padding: 3px;
        text-align: left;
        border: 1px solid var(--border-color);
        box-sizing: border-box;

    }
    .rowpadded {
        height:20px;
    }
    .column75 {
        float: left;
        width: 75%;
    }
    .column90 {
        float: left;
        width: 90%;
    }
    .column25 {
        float: left;
        width: 25%;
    }
    .column10 {
        float: left;
        width: 10%;
    }

  .block {
    border: 1px;

    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

</style>

<script>
</script>

<div>
  <div class="navbar">
    <a href="/">Welcome</a>
    <a href="/activeEvents"><b>Active Events</b></a>
    <a href="/recurringEvents">Recurring Events</a>
    <a href="/archives">Archives</a>
    <a href="/sections">Sections</a>
    <a href="/operators">Operators</a>
    <a href="/locations">Locations</a>
    <button th:replace="~{fragments/theme :: toggle}"></button>
  </div>
  <div class="main">
    <div><hr/></div>
    <div style="margin:20px;">
    <h1>Update Participant Details - [[${participant?.operator?.callsign}]]</h1>
    <p>Update details such as power sources, transmit power, check-in and check-out times.
    <div class="line" style="margin:0px"><hr/></div>
    </div>

    <div style="margin:20px;">
      <form th:action="|/participant-edittimes-action/${participant?.id}|" method="post">
        <div class="mb-3">
            <label for="startTimeStr" class="form-label">Start time:</label>
            <input type="datetime-local" name="startTimeStr" id="startTimeStr" th:value="|${participant?.startTime}|" class="form-control"/>
        </div>
        <th:block th:if="${showEndTime}">
        <div class="mb-3">
            <label for="endTimeStr" class="form-label">End time:</label>
            <input type="datetime-local" name="endTimeStr" id="endTimeStr" th:value="|${participant?.endTime}|" class="form-control"/>
        </div>
        </th:block>
        <div class="mb-3">
            <label for="transmitPower" class="form-label">Transmit power:</label>
            <input type="number" name="transmitPower" id="transmitPower" th:value="|${participant?.transmitPower}|" class="form-control" min="0"/>
        </div>
        <div>
            <label for="primaryPowerSource" class="form-label">Primary power source:</label>
            <select name="primaryPowerSource" id="primaryPowerSource">
              <th:block th:if="${primaryPowerSource0}">
              <option value="0" selected>Unknown</option>
              </th:block><th:block th:unless="${primaryPowerSource0}">
              <option value="0">Unknown</option>
              </th:block>
              <th:block th:if="${primaryPowerSource1}">
              <option value="1" selected>Commercial</option>
              </th:block><th:block th:unless="${primaryPowerSource1}">
              <option value="1">Commercial</option>
              </th:block>
              <th:block th:if="${primaryPowerSource2}">
              <option value="2" selected>Generator</option>
              </th:block><th:block th:unless="${primaryPowerSource2}">
              <option value="2">Generator</option>
              </th:block>
              <th:block th:if="${primaryPowerSource3}">
              <option value="3" selected>Solar</option>
              </th:block><th:block th:unless="${primaryPowerSource3}">
              <option value="3">Solar</option>
              </th:block>
              <th:block th:if="${primaryPowerSource4}">
              <option value="4" selected>Battery</option>
              </th:block><th:block th:unless="${primaryPowerSource4}">
              <option value="4">Battery</option>
              </th:block>
              <th:block th:if="${primaryPowerSource5}">
              <option value="5" selected>Other</option>
              </th:block><th:block th:unless="${primaryPowerSource5}">
              <option value="5">Other</option>
              </th:block>
              <th:block th:if="${primaryPowerSource6}">
              <option value="6" selected>None</option>
              </th:block><th:block th:unless="${primaryPowerSource6}">
              <option value="6">None</option>
              </th:block>
            </select>
        </div>
        <div>
            <label for="secondaryPowerSource" class="form-label">Secondary power source:</label>
            <select name="secondaryPowerSource" id="secondaryPowerSource">
              <th:block th:if="${secondaryPowerSource0}">
              <option value="0" selected>Unknown</option>
              </th:block><th:block th:unless="${secondaryPowerSource0}">
              <option value="0">Unknown</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource1}">
              <option value="1" selected>Commercial</option>
              </th:block><th:block th:unless="${secondaryPowerSource1}">
              <option value="1">Commercial</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource2}">
              <option value="2" selected>Generator</option>
              </th:block><th:block th:unless="${secondaryPowerSource2}">
              <option value="2">Generator</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource3}">
              <option value="3" selected>Solar</option>
              </th:block><th:block th:unless="${secondaryPowerSource3}">
              <option value="3">Solar</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource4}">
              <option value="4" selected>Battery</option>
              </th:block><th:block th:unless="${secondaryPowerSource4}">
              <option value="4">Battery</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource5}">
              <option value="5" selected>Other</option>
              </th:block><th:block th:unless="${secondaryPowerSource5}">
              <option value="5">Other</option>
              </th:block>
              <th:block th:if="${secondaryPowerSource6}">
              <option value="6" selected>None</option>
              </th:block><th:block th:unless="${secondaryPowerSource6}">
              <option value="6">None</option>
              </th:block>
            </select>
        </div>
        <div>
            <label for="communicationPlatform" class="form-label">Communication platform:</label>
            <select name="communicationPlatform" id="communicationPlatform">
              <th:block th:if="${communicationPlatform0}">
              <option value="0" selected>Unknown</option>
              </th:block><th:block th:unless="${communicationPlatform0}">
              <option value="0">Unknown</option>
              </th:block>
              <th:block th:if="${communicationPlatform1}">
              <option value="1" selected>Radio (Phone)</option>
              </th:block><th:block th:unless="${communicationPlatform1}">
              <option value="1">Radio (Phone)</option>
              </th:block>
              <th:block th:if="${communicationPlatform2}">
              <option value="2" selected>EchoLink</option>
              </th:block><th:block th:unless="${communicationPlatform2}">
              <option value="2">EchoLink</option>
              </th:block>
              <th:block th:if="${communicationPlatform3}">
              <option value="3" selected>Radio (Packet)</option>
              </th:block><th:block th:unless="${communicationPlatform3}">
              <option value="3">Radio (Packet)</option>
              </th:block>
              <th:block th:if="${communicationPlatform4}">
              <option value="4" selected>Internet (Packet)</option>
              </th:block><th:block th:unless="${communicationPlatform4}">
              <option value="4">Internet (Packet)</option>
              </th:block>
            </select>
        </div>
        <div>
            <label for="communicationBand" class="form-label">Communication band:</label>
            <select name="communicationBand" id="communicationBand">
              <th:block th:if="${communicationBand0}">
              <option value="0" selected>Unknown</option>
              </th:block><th:block th:unless="${communicationBand0}">
              <option value="0">Unknown</option>
              </th:block>
              <th:block th:if="${communicationBand1}">
              <option value="1" selected>Internet</option>
              </th:block><th:block th:unless="${communicationBand1}">
              <option value="1">Internet</option>
              </th:block>
              <th:block th:if="${communicationBand2}">
              <option value="2" selected>70cm</option>
              </th:block><th:block th:unless="${communicationBand2}">
              <option value="2">70cm</option>
              </th:block>
              <th:block th:if="${communicationBand9}">
              <option value="9" selected>1.25m</option>
              </th:block><th:block th:unless="${communicationBand9}">
              <option value="9">1.25m</option>
              </th:block>
              <th:block th:if="${communicationBand3}">
              <option value="3" selected>2m</option>
              </th:block><th:block th:unless="${communicationBand3}">
              <option value="3">2m</option>
              </th:block>
              <th:block th:if="${communicationBand4}">
              <option value="4" selected>6m</option>
              </th:block><th:block th:unless="${communicationBand4}">
              <option value="4">6m</option>
              </th:block>
              <th:block th:if="${communicationBand5}">
              <option value="5" selected>10m</option>
              </th:block><th:block th:unless="${communicationBand5}">
              <option value="5">10m</option>
              </th:block>
              <th:block th:if="${communicationBand6}">
              <option value="6" selected>20m</option>
              </th:block><th:block th:unless="${communicationBand6}">
              <option value="6">20m</option>
              </th:block>
              <th:block th:if="${communicationBand7}">
              <option value="7" selected>40m</option>
              </th:block><th:block th:unless="${communicationBand7}">
              <option value="7">40m</option>
              </th:block>
              <th:block th:if="${communicationBand8}">
              <option value="8" selected>80m</option>
              </th:block><th:block th:unless="${communicationBand8}">
              <option value="8">80m</option>
              </th:block>
            </select>
        </div>
        <div class="line" style="margin:0px"><hr/></div>
        <div>
          <input type="submit" value="Update" class="btn btn-primary block"/>
          <a class="block" th:href="|/activeEvent/${participant?.event?.id}|">Cancel</a>
        </div>
      </form>
    </div>
  </div>
  </div>
</div>

</body>
</html>
